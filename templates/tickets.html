{% extends "base.html" %}

{% block title %}Destek Talepleri{% endblock %}
{% block nav_tickets %}active{% endblock %}

{% block content %}
<div class="fade-in">
    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Destek Talepleri</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Bilet oluştur, takip et ve yönet</p>
        </div>
        <button onclick="openCreateTicketModal()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 text-white text-sm font-semibold shadow-lg shadow-brand-500/25 hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i>
            Yeni Talep
        </button>
    </div>

    <!-- Filters -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm p-4 mb-6">
        <div class="flex flex-wrap items-center gap-3">
            <div class="relative flex-1 min-w-[200px]">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="ticket-search" placeholder="Başlık veya açıklamada ara..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
            </div>
            <select id="filter-ticket-durum" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-white text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
                <option value="">Tüm Durumlar</option>
                <option value="YENI">Yeni</option>
                <option value="ISLEMDE">İşlemde</option>
                <option value="BEKLEMEDE">Beklemede</option>
                <option value="COZULDU">Çözüldü</option>
                <option value="KAPATILDI">Kapatıldı</option>
            </select>
            <select id="filter-ticket-aciliyet" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-white text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
                <option value="">Tüm Aciliyetler</option>
                <option value="DUSUK">Düşük</option>
                <option value="NORMAL">Normal</option>
                <option value="YUKSEK">Yüksek</option>
                <option value="KRITIK">Kritik</option>
            </select>
        </div>
    </div>

    <!-- Tickets List -->
    <div id="tickets-container" class="space-y-3">
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm px-6 py-12 text-center text-slate-400">
            <i data-lucide="loader-2" class="w-5 h-5 mx-auto mb-2 animate-spin text-slate-300"></i>
            Yükleniyor...
        </div>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between mt-4">
        <p id="tickets-info" class="text-xs text-slate-400"></p>
        <div class="flex gap-1" id="tickets-pagination"></div>
    </div>
</div>

<!-- ======== CREATE TICKET MODAL ======== -->
<div id="create-ticket-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-lg mx-4 slide-up">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-700">
            <h3 class="text-lg font-semibold text-slate-800 dark:text-white">Yeni Destek Talebi</h3>
            <button onclick="closeCreateTicketModal()" class="p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
                <i data-lucide="x" class="w-5 h-5 text-slate-400"></i>
            </button>
        </div>
        <form id="create-ticket-form" onsubmit="handleCreateTicket(event)" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Başlık</label>
                <input type="text" id="ticket-baslik" required class="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500" placeholder="Sorununuzu kısaca özetleyin">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Açıklama</label>
                <textarea id="ticket-aciklama" required rows="3" class="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500" placeholder="Detaylı açıklama yazın..."></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                    <select id="ticket-kategori" required class="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
                        <option value="DONANIM">Donanım</option>
                        <option value="YAZILIM">Yazılım</option>
                        <option value="AG_ERISIMI">Ağ / Erişim</option>
                        <option value="DIGER">Diğer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Aciliyet</label>
                    <select id="ticket-aciliyet" required class="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
                        <option value="DUSUK">Düşük</option>
                        <option value="NORMAL" selected>Normal</option>
                        <option value="YUKSEK">Yüksek</option>
                        <option value="KRITIK">Kritik</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeCreateTicketModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">İptal</button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 transition-colors shadow-sm">Oluştur</button>
            </div>
        </form>
    </div>
</div>

<!-- ======== TICKET DETAIL MODAL ======== -->
<div id="ticket-detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-lg mx-4 slide-up max-h-[80vh] overflow-y-auto">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-700 sticky top-0 bg-white dark:bg-slate-800 rounded-t-2xl z-10">
            <h3 class="text-lg font-semibold text-slate-800 dark:text-white">Bilet Detayı</h3>
            <button onclick="closeDetailModal()" class="p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
                <i data-lucide="x" class="w-5 h-5 text-slate-400"></i>
            </button>
        </div>
        <div id="ticket-detail-content" class="p-6">
            <!-- Filled by JS -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
        if (!requireAuth()) return;
        currentUser = await loadUserInfo();
        loadTickets();

        document.getElementById('ticket-search').addEventListener('input', debounce(loadTickets, 300));
        document.getElementById('filter-ticket-durum').addEventListener('change', loadTickets);
        document.getElementById('filter-ticket-aciliyet').addEventListener('change', loadTickets);
    });

    async function loadTickets(page = 1) {
        const search = document.getElementById('ticket-search').value;
        const durum = document.getElementById('filter-ticket-durum').value;
        const aciliyet = document.getElementById('filter-ticket-aciliyet').value;
        let url = `/api/tickets/?page=${typeof page === 'number' ? page : 1}&ordering=-olusturma_tarihi`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (durum) url += `&durum=${durum}`;
        if (aciliyet) url += `&aciliyet=${aciliyet}`;

        const resp = await api(url);
        if (!resp?.ok) return;
        const data = await resp.json();
        renderTickets(data.results || []);

        document.getElementById('tickets-info').textContent = `Toplam ${data.count || 0} talep`;
        let pagBtns = '';
        if (data.previous) pagBtns += `<button onclick="loadTickets(${getPageNum(data, 'prev')})" class="px-3 py-1 rounded-lg border border-slate-200 text-xs hover:bg-slate-50 transition-colors">← Önceki</button>`;
        if (data.next) pagBtns += `<button onclick="loadTickets(${getPageNum(data, 'next')})" class="px-3 py-1 rounded-lg border border-slate-200 text-xs hover:bg-slate-50 transition-colors">Sonraki →</button>`;
        document.getElementById('tickets-pagination').innerHTML = pagBtns;
    }

    function getPageNum(data, dir) {
        const url = dir === 'prev' ? data.previous : data.next;
        if (!url) return 1;
        const u = new URL(url, window.location.origin);
        return parseInt(u.searchParams.get('page') || '1');
    }

    function renderTickets(tickets) {
        const container = document.getElementById('tickets-container');
        if (!tickets.length) {
            container.innerHTML = '<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm px-6 py-12 text-center text-slate-400">Bilet bulunamadı.</div>';
            return;
        }

        const isStaff = currentUser && ['ADMIN', 'IT_UZMANI'].includes(currentUser.rol);

        container.innerHTML = tickets.map(t => `
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden cursor-pointer" onclick="openDetailModal(${t.id})">
                <div class="px-6 py-4 flex items-start gap-4">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            ${statusBadge(t.durum, 'ticket')}
                            ${statusBadge(t.aciliyet, 'aciliyet')}
                            <span class="text-xs text-slate-400 ml-auto">#${t.id}</span>
                        </div>
                        <h3 class="text-sm font-semibold text-slate-800 dark:text-white truncate">${t.baslik}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-1">${t.aciklama}</p>
                        <div class="flex items-center gap-4 mt-2 text-xs text-slate-400 dark:text-slate-500">
                            <span><i data-lucide="user" class="w-3 h-3 inline mr-1"></i>${t.olusturan_ad}</span>
                            <span><i data-lucide="calendar" class="w-3 h-3 inline mr-1"></i>${new Date(t.olusturma_tarihi).toLocaleDateString('tr-TR')}</span>
                            ${t.atanan_it_uzmani_ad ? `<span><i data-lucide="headset" class="w-3 h-3 inline mr-1"></i>${t.atanan_it_uzmani_ad}</span>` : ''}
                        </div>
                    </div>
                    ${isStaff ? `
                    <div class="flex flex-col gap-1 flex-shrink-0">
                        ${t.durum === 'YENI' ? `<button onclick="event.stopPropagation(); assignTicket(${t.id})" class="px-2.5 py-1 rounded-lg bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 text-xs font-medium hover:bg-brand-100 dark:hover:bg-brand-900/50 transition-colors">Üstlen</button>` : ''}
                    </div>` : ''}
                </div>
            </div>
        `).join('');
        lucide.createIcons();
    }

    // ── Create Ticket ──
    function openCreateTicketModal() {
        document.getElementById('create-ticket-form').reset();
        document.getElementById('create-ticket-modal').classList.remove('hidden');
    }
    function closeCreateTicketModal() { document.getElementById('create-ticket-modal').classList.add('hidden'); }

    async function handleCreateTicket(e) {
        e.preventDefault();
        const body = {
            baslik: document.getElementById('ticket-baslik').value,
            aciklama: document.getElementById('ticket-aciklama').value,
            kategori: document.getElementById('ticket-kategori').value,
            aciliyet: document.getElementById('ticket-aciliyet').value,
        };

        const resp = await api('/api/tickets/', { method: 'POST', body: JSON.stringify(body) });
        if (resp?.ok) {
            showToast('Destek talebi oluşturuldu.', 'success');
            closeCreateTicketModal();
            loadTickets();
        } else {
            const err = await resp?.json().catch(() => ({}));
            showToast(Object.values(err).flat().join(' ') || 'Hata oluştu.', 'error');
        }
    }

    // ── Assign Ticket ──
    async function assignTicket(ticketId) {
        const resp = await api(`/api/tickets/${ticketId}/assign/`, { method: 'PATCH', body: '{}' });
        if (resp?.ok) {
            showToast('Bilet üstünüze atandı.', 'success');
            loadTickets();
        } else {
            const err = await resp?.json().catch(() => ({}));
            showToast(err.detail || 'Atama başarısız.', 'error');
        }
    }

    // ── Ticket Detail ──
    async function openDetailModal(ticketId) {
        document.getElementById('ticket-detail-modal').classList.remove('hidden');
        const resp = await api(`/api/tickets/${ticketId}/`);
        if (!resp?.ok) return;
        const t = await resp.json();

        const isStaff = currentUser && ['ADMIN', 'IT_UZMANI'].includes(currentUser.rol);
        const isOwner = t.olusturan === currentUser?.id;

        const statusOptions = {
            'YENI': [{ value: 'ISLEMDE', label: 'İşleme Al' }],
            'ISLEMDE': [{ value: 'BEKLEMEDE', label: 'Beklet' }, { value: 'COZULDU', label: 'Çözüldü' }],
            'BEKLEMEDE': [{ value: 'ISLEMDE', label: 'İşleme Döndür' }],
            'COZULDU': [{ value: 'KAPATILDI', label: 'Kapat' }, { value: 'YENI', label: 'Tekrar Aç' }],
            'KAPATILDI': [],
        };

        let actionsHtml = '';
        const transitions = statusOptions[t.durum] || [];
        if (isStaff || isOwner) {
            const allowedForUser = isStaff ? transitions : transitions.filter(tr => ['KAPATILDI', 'YENI'].includes(tr.value));
            if (allowedForUser.length) {
                actionsHtml = `
                    <div class="mt-6 pt-4 border-t border-slate-100">
                        <p class="text-xs font-semibold text-slate-500 uppercase mb-2">Durum Güncelle</p>
                        <div class="flex flex-wrap gap-2">
                            ${allowedForUser.map(tr => `
                                <button onclick="updateTicketStatus(${t.id}, '${tr.value}')" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium hover:bg-slate-50 transition-colors">${tr.label}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        document.getElementById('ticket-detail-content').innerHTML = `
            <div class="space-y-4">
                <div class="flex items-center gap-2">
                    ${statusBadge(t.durum, 'ticket')}
                    ${statusBadge(t.aciliyet, 'aciliyet')}
                    ${statusBadge(t.kategori, 'aciliyet')}
                    <span class="text-xs text-slate-400 ml-auto">#${t.id}</span>
                </div>
                <h2 class="text-xl font-bold text-slate-800">${t.baslik}</h2>
                <p class="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap">${t.aciklama}</p>

                <div class="grid grid-cols-2 gap-4 bg-slate-50 rounded-xl p-4 text-sm">
                    <div>
                        <p class="text-xs text-slate-500 mb-0.5">Oluşturan</p>
                        <p class="font-medium text-slate-700">${t.olusturan_ad}</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 mb-0.5">Atanan</p>
                        <p class="font-medium text-slate-700">${t.atanan_it_uzmani_ad || '—'}</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 mb-0.5">Oluşturma</p>
                        <p class="font-medium text-slate-700">${new Date(t.olusturma_tarihi).toLocaleString('tr-TR')}</p>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 mb-0.5">Güncelleme</p>
                        <p class="font-medium text-slate-700">${new Date(t.guncelleme_tarihi).toLocaleString('tr-TR')}</p>
                    </div>
                </div>

                ${actionsHtml}
            </div>
        `;
        lucide.createIcons();
    }

    function closeDetailModal() { document.getElementById('ticket-detail-modal').classList.add('hidden'); }

    async function updateTicketStatus(ticketId, newStatus) {
        const resp = await api(`/api/tickets/${ticketId}/status/`, {
            method: 'PATCH',
            body: JSON.stringify({ yeni_durum: newStatus }),
        });
        if (resp?.ok) {
            showToast('Durum güncellendi.', 'success');
            closeDetailModal();
            loadTickets();
        } else {
            const err = await resp?.json().catch(() => ({}));
            showToast(err.yeni_durum?.[0] || err.detail || 'Güncelleme başarısız.', 'error');
        }
    }

    function debounce(fn, delay) {
        let timer;
        return function (...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
        };
    }
</script>
{% endblock %}
