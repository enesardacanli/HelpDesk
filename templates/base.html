<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IT Destek ve Envanter Yönetim Sistemi — Kurumsal BT altyapınızı yönetin.">
    <title>{% block title %}Helpdesk{% endblock %} | IT Destek Sistemi</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                            950: '#1e1b4b',
                        },
                        surface: {
                            50:  '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            700: '#1e293b',
                            800: '#0f172a',
                            900: '#020617',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* ---- Global Scrollbar ---- */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* ---- Micro Animations ---- */
        .fade-in { animation: fadeIn .35s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .slide-up { animation: slideUp .3s cubic-bezier(.22,1,.36,1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

        /* ---- Glassmorphism Modal Backdrop ---- */
        .modal-backdrop {
            background: rgba(2,6,23,.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        /* ---- Sidebar Hover ---- */
        .nav-link {
            transition: all .2s ease;
        }
        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, rgba(99,102,241,.15), rgba(99,102,241,.05));
            color: #818cf8;
        }
        .nav-link.active {
            border-right: 3px solid #6366f1;
        }

        /* ---- Badge Pulse ---- */
        .badge-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }

        /* ---- Toast ---- */
        .toast-enter { animation: toastIn .4s ease-out; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        .toast-exit { animation: toastOut .3s ease-in forwards; }
        @keyframes toastOut { to { opacity: 0; transform: translateX(100%); } }
    </style>
</head>

<body class="h-full bg-surface-50 font-sans text-slate-800 antialiased">

    {% block body %}
    <div id="app" class="flex h-full">

        <!-- ======== SIDEBAR ======== -->
        <aside id="sidebar" class="hidden lg:flex flex-col w-64 bg-surface-800 text-slate-300 border-r border-slate-700/50 fixed inset-y-0 z-30 transition-transform duration-300">
            <!-- Logo -->
            <div class="flex items-center gap-3 px-6 py-5 border-b border-slate-700/50">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/25">
                    <i data-lucide="headset" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-white tracking-wide">HelpDesk</h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest">IT Yönetim</p>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
                <a href="/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {% block nav_dashboard %}{% endblock %}" id="nav-dashboard">
                    <i data-lucide="layout-dashboard" class="w-[18px] h-[18px]"></i>
                    Dashboard
                </a>
                <a href="/tickets/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {% block nav_tickets %}{% endblock %}" id="nav-tickets">
                    <i data-lucide="ticket" class="w-[18px] h-[18px]"></i>
                    Destek Talepleri
                </a>
                <a href="/inventory/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {% block nav_inventory %}{% endblock %}" id="nav-inventory">
                    <i data-lucide="monitor" class="w-[18px] h-[18px]"></i>
                    Envanter
                </a>
                <a href="/logs/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {% block nav_logs %}{% endblock %}" id="nav-logs">
                    <i data-lucide="scroll-text" class="w-[18px] h-[18px]"></i>
                    Zimmet Logları
                </a>

                <div class="!mt-6 px-3">
                    <p class="text-[10px] uppercase tracking-widest text-slate-600 font-semibold mb-2">Yönetim</p>
                </div>
                <a href="/admin/" target="_blank" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium" id="nav-admin">
                    <i data-lucide="shield-check" class="w-[18px] h-[18px]"></i>
                    Admin Paneli
                    <i data-lucide="external-link" class="w-3 h-3 ml-auto opacity-40"></i>
                </a>
            </nav>

            <!-- User Info -->
            <div class="border-t border-slate-700/50 px-4 py-3">
                <div class="flex items-center gap-3">
                    <div id="sidebar-avatar" class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white text-xs font-bold shadow">
                        ?
                    </div>
                    <div class="flex-1 min-w-0">
                        <p id="sidebar-username" class="text-sm font-medium text-white truncate">—</p>
                        <p id="sidebar-role" class="text-[11px] text-slate-500 truncate">—</p>
                    </div>
                    <button onclick="logout()" class="p-1.5 rounded-lg hover:bg-slate-700 transition-colors" title="Çıkış Yap">
                        <i data-lucide="log-out" class="w-4 h-4 text-slate-500"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- ======== MAIN CONTENT ======== -->
        <div class="flex-1 lg:ml-64 flex flex-col min-h-screen">

            <!-- Top Bar (Mobile) -->
            <header class="lg:hidden sticky top-0 z-20 bg-white/80 backdrop-blur-lg border-b border-slate-200 px-4 py-3 flex items-center justify-between">
                <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-slate-100 transition-colors">
                    <i data-lucide="menu" class="w-5 h-5 text-slate-600"></i>
                </button>
                <h1 class="text-sm font-bold text-brand-600 tracking-wide">HelpDesk</h1>
                <button onclick="logout()" class="p-2 rounded-lg hover:bg-slate-100 transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5 text-slate-600"></i>
                </button>
            </header>

            <!-- Page Content -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            <footer class="border-t border-slate-200 px-6 py-3 text-center">
                <p class="text-xs text-slate-400">&copy; 2026 IT Destek ve Envanter Yönetim Sistemi</p>
            </footer>
        </div>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/40 z-20 lg:hidden" onclick="toggleSidebar()"></div>
    {% endblock %}

    <!-- ======== TOAST CONTAINER ======== -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2 w-80"></div>

    <!-- ======== CORE JS ======== -->
    <script>
        // ── Token Management ──
        const TOKEN_KEY = 'helpdesk_access';
        const REFRESH_KEY = 'helpdesk_refresh';
        const USER_KEY = 'helpdesk_user';

        function getToken() { return localStorage.getItem(TOKEN_KEY); }
        function setTokens(access, refresh) {
            localStorage.setItem(TOKEN_KEY, access);
            localStorage.setItem(REFRESH_KEY, refresh);
        }
        function clearAuth() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(REFRESH_KEY);
            localStorage.removeItem(USER_KEY);
        }

        // ── Auth Guard ──
        function requireAuth() {
            if (!getToken()) {
                window.location.href = '/login/';
                return false;
            }
            return true;
        }

        // ── API Fetch Wrapper ──
        async function api(url, options = {}) {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            let response = await fetch(url, { ...options, headers });

            // Token refresh on 401
            if (response.status === 401) {
                const refreshToken = localStorage.getItem(REFRESH_KEY);
                if (refreshToken) {
                    const refreshResp = await fetch('/api/auth/token/refresh/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh: refreshToken }),
                    });
                    if (refreshResp.ok) {
                        const data = await refreshResp.json();
                        setTokens(data.access, data.refresh || refreshToken);
                        headers['Authorization'] = `Bearer ${data.access}`;
                        response = await fetch(url, { ...options, headers });
                    } else {
                        clearAuth();
                        window.location.href = '/login/';
                        return null;
                    }
                } else {
                    clearAuth();
                    window.location.href = '/login/';
                    return null;
                }
            }

            return response;
        }

        // ── Logout ──
        function logout() {
            clearAuth();
            window.location.href = '/login/';
        }

        // ── Mobile Sidebar Toggle ──
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('flex');
            overlay.classList.toggle('hidden');
        }

        // ── Toast Notifications ──
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-emerald-500',
                error:   'bg-red-500',
                warning: 'bg-amber-500',
                info:    'bg-brand-500',
            };
            const icons = {
                success: 'check-circle-2',
                error:   'x-circle',
                warning: 'alert-triangle',
                info:    'info',
            };

            const toast = document.createElement('div');
            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg shadow-black/10 text-white text-sm font-medium ${colors[type] || colors.info}`;
            toast.innerHTML = `<i data-lucide="${icons[type] || icons.info}" class="w-5 h-5 flex-shrink-0"></i><span class="flex-1">${message}</span>`;

            container.appendChild(toast);
            lucide.createIcons({ nodes: [toast] });

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                toast.addEventListener('animationend', () => toast.remove());
            }, 3500);
        }

        // ── Load User Info into Sidebar ──
        async function loadUserInfo() {
            const cached = localStorage.getItem(USER_KEY);
            if (cached) {
                const user = JSON.parse(cached);
                renderUserInfo(user);
                return user;
            }

            const resp = await api('/api/kullanicilar/me/');
            if (resp && resp.ok) {
                const user = await resp.json();
                localStorage.setItem(USER_KEY, JSON.stringify(user));
                renderUserInfo(user);
                return user;
            }
            return null;
        }

        function renderUserInfo(user) {
            const avatar = document.getElementById('sidebar-avatar');
            const username = document.getElementById('sidebar-username');
            const role = document.getElementById('sidebar-role');
            if (avatar) avatar.textContent = (user.ad?.[0] || '') + (user.soyad?.[0] || '');
            if (username) username.textContent = `${user.ad} ${user.soyad}`;

            const roleLabels = {
                'ADMIN': 'Admin',
                'IT_UZMANI': 'IT Uzmanı',
                'DEPARTMAN_YONETICISI': 'Dept. Yöneticisi',
                'STANDART_KULLANICI': 'Kullanıcı',
            };
            if (role) role.textContent = roleLabels[user.rol] || user.rol;
        }

        // ── Status Badge Helper ──
        function statusBadge(value, type = 'ticket') {
            const ticketColors = {
                'YENI':      'bg-sky-100 text-sky-700 ring-sky-500/20',
                'ISLEMDE':   'bg-amber-100 text-amber-700 ring-amber-500/20',
                'BEKLEMEDE': 'bg-slate-100 text-slate-600 ring-slate-500/20',
                'COZULDU':   'bg-emerald-100 text-emerald-700 ring-emerald-500/20',
                'KAPATILDI': 'bg-slate-200 text-slate-500 ring-slate-500/20',
            };
            const donanimColors = {
                'DEPODA':     'bg-emerald-100 text-emerald-700 ring-emerald-500/20',
                'KULLANIMDA': 'bg-sky-100 text-sky-700 ring-sky-500/20',
                'ARIZALI':   'bg-red-100 text-red-700 ring-red-500/20',
                'HURDA':     'bg-slate-200 text-slate-500 ring-slate-500/20',
            };
            const aciliyetColors = {
                'DUSUK':  'bg-slate-100 text-slate-600',
                'NORMAL': 'bg-sky-100 text-sky-700',
                'YUKSEK': 'bg-amber-100 text-amber-700',
                'KRITIK': 'bg-red-100 text-red-700',
            };
            const labels = {
                'YENI': 'Yeni', 'ISLEMDE': 'İşlemde', 'BEKLEMEDE': 'Beklemede',
                'COZULDU': 'Çözüldü', 'KAPATILDI': 'Kapatıldı',
                'DEPODA': 'Depoda', 'KULLANIMDA': 'Kullanımda',
                'ARIZALI': 'Arızalı', 'HURDA': 'Hurda',
                'DUSUK': 'Düşük', 'NORMAL': 'Normal', 'YUKSEK': 'Yüksek', 'KRITIK': 'Kritik',
                'DONANIM': 'Donanım', 'YAZILIM': 'Yazılım', 'AG_ERISIMI': 'Ağ/Erişim', 'DIGER': 'Diğer',
            };

            let colorClass = '';
            if (type === 'ticket') colorClass = ticketColors[value] || '';
            else if (type === 'donanim') colorClass = donanimColors[value] || '';
            else if (type === 'aciliyet') colorClass = aciliyetColors[value] || '';

            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ring-1 ring-inset ${colorClass}">${labels[value] || value}</span>`;
        }

        // ── Init Icons ──
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
