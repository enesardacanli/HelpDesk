{% extends "base.html" %}

{% block title %}Aktivite Geçmişi{% endblock %}
{% block nav_activity %}active{% endblock %}

{% block content %}
<div class="fade-in">
    <!-- Page Header -->
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Aktivite Geçmişi</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Tüm işlemlerinizin kronolojik zaman çizelgesi</p>
    </div>

    <!-- Timeline -->
    <div id="activity-container" class="space-y-3">
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm px-6 py-12 text-center text-slate-400">
            <i data-lucide="loader-2" class="w-5 h-5 mx-auto mb-2 animate-spin text-slate-300"></i>
            Yükleniyor...
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if (!requireAuth()) return;
        await loadUserInfo();
        loadActivity();
    });

    async function loadActivity() {
        const container = document.getElementById('activity-container');
        const resp = await api('/api/activity/');
        if (!resp?.ok) {
            container.innerHTML = '<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm px-6 py-12 text-center text-slate-400">Aktivite yuklenemedi.</div>';
            return;
        }
        const events = await resp.json();
        if (!events.length) {
            container.innerHTML = '<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm px-6 py-12 text-center text-slate-400">Henuz aktivite yok.</div>';
            return;
        }

        const colorMap = {
            brand:   { bg: 'bg-brand-100 dark:bg-brand-900/30', text: 'text-brand-600 dark:text-brand-400', border: 'border-l-brand-400' },
            emerald: { bg: 'bg-emerald-100 dark:bg-emerald-900/30', text: 'text-emerald-600 dark:text-emerald-400', border: 'border-l-emerald-400' },
            amber:   { bg: 'bg-amber-100 dark:bg-amber-900/30', text: 'text-amber-600 dark:text-amber-400', border: 'border-l-amber-400' },
        };

        container.innerHTML = events.map((e, i) => {
            const c = colorMap[e.color] || colorMap.brand;
            return `
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden border-l-4 ${c.border} slide-up" style="animation-delay: ${i * 0.03}s;">
                    <div class="px-6 py-4 flex items-start gap-4">
                        <div class="w-10 h-10 rounded-xl ${c.bg} ${c.text} flex items-center justify-center flex-shrink-0 mt-0.5">
                            <i data-lucide="${e.icon}" class="w-5 h-5"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-sm font-semibold text-slate-800 dark:text-white truncate">${e.title}</span>
                            </div>
                            ${e.detail ? `<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-1">${e.detail}</p>` : ''}
                            <p class="text-[10px] text-slate-400 mt-1">
                                <i data-lucide="clock" class="w-3 h-3 inline mr-0.5"></i>
                                ${new Date(e.date).toLocaleString('tr-TR')}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        lucide.createIcons();
    }
</script>
{% endblock %}
